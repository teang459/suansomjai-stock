name: CI

# Lint + test on every push and PR. Both deploys run automatically on push
# to master — Vercel (primary origin) and GitHub Pages (live mirror, via
# deploy.yml). Vercel does not gate on tests, so this workflow is its gate.
# deploy.yml runs its own lint/typecheck/test before publishing to Pages.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=optional

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test
